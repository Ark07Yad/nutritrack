# Frontend deployment — a static-assets Worker (Cloudflare's recommended path
# for new projects, in place of Pages).
#
#   npm run build
#   npx wrangler deploy
#
# The push backend is a separate Worker; its config lives in worker/.

name = "nutritrack"
main = "worker-entry.js"
compatibility_date = "2026-08-12"

[assets]
directory = "./dist"
binding = "ASSETS"

# "none" makes a miss a real 404, which worker-entry.js then turns into either
# a clean 404 (missing asset) or the app shell (client route). The built-in
# single-page-application mode cannot tell those apart and answers both with
# index.html and a 200 — which is how a missing bundle becomes an unrelated
# MIME-type error.
not_found_handling = "none"
